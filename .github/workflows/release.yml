name: DISABLED - Legacy Release

# LEGACY_PIPELINE_DISABLED
# 旧流程会下载非本仓库产物、使用 SHA-1 并向第三方发布。安全发布链完成前禁止恢复。
on:
  workflow_dispatch:

permissions: {}

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse unsafe legacy release
        shell: bash
        run: |
          echo "::error::旧 Release 流程已禁用；请按 docs/SECURE_RELEASE_MIGRATION.md 重建发布链。"
          exit 1
