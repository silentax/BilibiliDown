name: DISABLED - Legacy Pre-release Artifacts

# LEGACY_PIPELINE_DISABLED
# 旧 Beta artifact 会被应用直接当作更新包执行，安全更新机制完成前禁止恢复。
on:
  workflow_dispatch:

permissions: {}

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse unsafe legacy pre-release build
        shell: bash
        run: |
          echo "::error::旧 Pre-release 流程已禁用；普通提交请使用 ci.yml 生成双平台 JAR artifacts。"
          exit 1
