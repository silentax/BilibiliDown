name: DISABLED - Legacy Windows Installer

# LEGACY_PIPELINE_DISABLED
# 旧 MSI 流程依赖原上游 JRE 压缩包且仅生成 SHA-1，禁止作为维护版安装包来源。
on:
  workflow_dispatch:

permissions: {}

jobs:
  legacy-disabled:
    runs-on: windows-latest
    timeout-minutes: 1
    steps:
      - name: Refuse unsafe legacy installer build
        shell: pwsh
        run: |
          Write-Error "旧 MSI 流程已禁用；请按 docs/SECURE_RELEASE_MIGRATION.md 使用 JDK 21 jpackage 重建。"
          exit 1
