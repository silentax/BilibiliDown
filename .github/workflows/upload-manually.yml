name: DISABLED - Legacy Third-party Upload

# LEGACY_PIPELINE_DISABLED
# 本 Fork 不再从原上游下载附件，也不向历史第三方存储或代码托管服务同步。
on:
  workflow_dispatch:

permissions: {}

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse legacy third-party upload
        shell: bash
        run: |
          echo "::error::旧第三方上传流程已禁用；维护版发布资产只能来自本仓库受控构建。"
          exit 1
