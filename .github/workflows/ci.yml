name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Gradle / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify commit author privacy
        shell: bash
        run: |
          author_email="$(git log -1 --format=%ae)"
          case "$author_email" in
            *@users.noreply.github.com) ;;
            *)
              echo "::error::Commit author email must use a GitHub noreply address."
              exit 1
              ;;
          esac

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test on macOS
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon --stacktrace clean check jar

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace clean check jar

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: INeedBiliAV-${{ matrix.os }}
          path: build/libs/INeedBiliAV.jar
          if-no-files-found: error
