plugins {
    id 'application'
    id 'java'
}

group = 'io.github.silentax'
version = '6.41-maintenance-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('javaToolchainVersion').getOrElse('21') as int)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    mainClass = 'nicelee.ui.FrameMain'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'nicelee/test/**'
        }
        resources {
            srcDirs = ['src']
            include 'resources/**'
        }
    }

    securityTest {
        java {
            srcDirs = ['src']
            include 'nicelee/test/security/**'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }

    uiExperienceTest {
        java {
            srcDirs = ['src']
            include 'nicelee/test/ui/**'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }

    contractTest {
        java {
            srcDirs = ['src']
            include 'nicelee/test/contract/**'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }

    manualE2e {
        java {
            srcDirs = ['manual-e2e/src']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    securityTestImplementation.extendsFrom implementation
    securityTestRuntimeOnly.extendsFrom runtimeOnly
    uiExperienceTestImplementation.extendsFrom implementation
    uiExperienceTestRuntimeOnly.extendsFrom runtimeOnly
    contractTestImplementation.extendsFrom implementation
    contractTestRuntimeOnly.extendsFrom runtimeOnly
    manualE2eImplementation.extendsFrom implementation
    manualE2eRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation 'javax.activation:activation:1.1.1'
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('securityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs security regression tests without JUnit.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.ResourcesUtilSecurityTest'
}

tasks.register('tlsSecurityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies that TLS certificate validation cannot be bypassed.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.TlsSecurityTest'
}

tasks.register('platformCompatibilityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies Windows and macOS runtime detection.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.PlatformCompatibilityTest'
}

tasks.register('ffmpegDownloadSecurityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies the pinned ffmpeg SHA-256 manifest and staged installation.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.FFmpegDownloadSecurityTest'
}

tasks.register('legacyUpdateSecurityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies that legacy self-update and release pipelines fail closed.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.LegacyUpdateSecurityTest'
}

tasks.register('sourcePluginSecurityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies that external Java source and bytecode plugins cannot execute.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.SourcePluginSecurityTest'
}

tasks.register('credentialSecurityTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies that login credentials are not persisted or retained in global strings.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.CredentialSecurityTest'
}

tasks.register('repositoryPrivacyTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies that tracked files do not expose credentials, personal paths, or runtime configuration.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.RepositoryPrivacyTest'
}

tasks.register('loggerPrivacyTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies centralized redaction of structured responses, signed URLs, and local paths.'
    dependsOn tasks.named('securityTestClasses')
    classpath = sourceSets.securityTest.runtimeClasspath
    mainClass = 'nicelee.test.security.LoggerPrivacyTest'
}

tasks.register('uiExperienceTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Verifies EDT dispatching and download progress formatting.'
    dependsOn tasks.named('uiExperienceTestClasses')
    classpath = sourceSets.uiExperienceTest.runtimeClasspath
    mainClass = 'nicelee.test.ui.UiExperienceTest'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.register('httpContractTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs local HTTP and download contract tests without external network access.'
    dependsOn tasks.named('contractTestClasses')
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'nicelee.test.contract.HttpRequestUtilContractTest'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.register('httpMultiThreadContractTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs loopback Range, resume, cancellation, and merge tests for the multi-thread downloader.'
    dependsOn tasks.named('contractTestClasses')
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'nicelee.test.contract.HttpRequestUtilExContractTest'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.register('manualE2e', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Manually parses and downloads the first part of a canonical Bilibili video URL.'
    dependsOn tasks.named('manualE2eClasses')
    classpath = sourceSets.manualE2e.runtimeClasspath
    mainClass = 'nicelee.test.e2e.ManualDownloadE2E'

    doFirst {
        String e2eUrl = providers.gradleProperty('e2eUrl').getOrElse('').trim()
        String e2eMode = providers.gradleProperty('e2eMode').getOrElse('all').trim()
        String e2eThreads = providers.gradleProperty('e2eThreads').getOrElse('0').trim()
        File dataDirectory = providers.gradleProperty('e2eDataDir')
                .map { file(it) }
                .getOrElse(temporaryDir)
        if (e2eUrl.isEmpty()) {
            throw new GradleException('manualE2e requires -Pe2eUrl=https://www.bilibili.com/video/BV.../')
        }
        if (!dataDirectory.exists() && !dataDirectory.mkdirs()) {
            throw new GradleException('Unable to create the isolated manual E2E data directory')
        }
        systemProperty 'e2e.url', e2eUrl
        systemProperty 'e2e.mode', e2eMode
        systemProperty 'e2e.threads', e2eThreads
        systemProperty 'e2e.dataDir', dataDirectory.absolutePath
        systemProperty 'bilibili.prop.dataDirPath', dataDirectory.absolutePath
    }

    jvmArgs '-Djava.awt.headless=true', '-Dfile.encoding=UTF-8'
}

tasks.named('check') {
    dependsOn tasks.named('securityTest'), tasks.named('tlsSecurityTest'), tasks.named('platformCompatibilityTest'),
            tasks.named('ffmpegDownloadSecurityTest'), tasks.named('legacyUpdateSecurityTest'),
            tasks.named('sourcePluginSecurityTest'), tasks.named('credentialSecurityTest'),
            tasks.named('repositoryPrivacyTest'), tasks.named('loggerPrivacyTest'), tasks.named('uiExperienceTest'),
            tasks.named('httpContractTest'), tasks.named('httpMultiThreadContractTest')
}

tasks.named('jar') {
    archiveFileName = 'INeedBiliAV.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.SF'
}

tasks.register('smokeTest', JavaExec) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs the packaged application in headless version mode.'
    dependsOn tasks.named('jar')
    classpath = files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'nicelee.ui.FrameMain'
    jvmArgs '-Djava.awt.headless=true', '-Dfile.encoding=UTF-8'
    args '-v'
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest')
}

tasks.named('wrapper') {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.BIN
}
